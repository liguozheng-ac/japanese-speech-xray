<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1095" viewBox="0 0 1440 1095" role="img" aria-labelledby="title desc">
<title id="title">End-to-end data processing</title><desc id="desc">Three paths share the same validated audio asset; pitch extraction does not wait for forced alignment.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7b8ba5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.sub{font-size:20px;fill:#62718b}.label{font-size:19px;font-weight:700;letter-spacing:1px}.heading{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#52637f}.edge{fill:none;stroke:#7b8ba5;stroke-width:2.4;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style>
<rect width="1440" height="1095" fill="#ffffff"/>
<text class="title" x="44" y="52">End-to-end data processing</text><text class="sub" x="44" y="84">Three paths share the same validated audio asset; pitch extraction does not wait for forced alignment.</text>
<rect x="40" y="118" width="1360" height="132" rx="16" fill="#f5f2ff" stroke="#d4c7f6" stroke-width="1.6"/>
<text class="heading" x="64" y="156" style="fill:#17243b">01  CONTROLLED SENTENCE + AUDIO INPUT</text>
<text class="body" x="64" y="192">Browser capture or upload → Mono PCM16 RIFF WAV → validated session audio asset</text>
<text class="body" x="64" y="222">8–48 kHz  ·  Up to 30 seconds / 10 MiB  ·  Original time coordinates and provenance retained</text>
<path class="edge" d="M250 250V320"/>
<path class="edge" d="M720 250V320"/>
<path class="edge" d="M1190 250V320"/>
<rect x="40" y="324" width="420" height="132" rx="16" fill="#f5f2ff" stroke="#d4c7f6" stroke-width="1.6"/>
<text class="heading" x="64" y="362" style="fill:#17243b">A  LOCAL PRACTICE</text>
<text class="body" x="64" y="398">No analysis request required</text>
<text class="body" x="64" y="428">Actual PCM waveform + selections</text>
<rect x="510" y="324" width="420" height="132" rx="16" fill="#eefaf5" stroke="#b9e2d1" stroke-width="1.6"/>
<text class="heading" x="534" y="362" style="fill:#17243b">B  PITCH REQUEST</text>
<text class="body" x="534" y="398">POST /api/prosody/v1/curves</text>
<text class="body" x="534" y="428">Validate WAV + prompt identity</text>
<rect x="980" y="324" width="420" height="132" rx="16" fill="#fff7ed" stroke="#efcfaa" stroke-width="1.6"/>
<text class="heading" x="1004" y="362" style="fill:#17243b">C  OPTIONAL X-RAY</text>
<text class="body" x="1004" y="398">POST /api/v1/analyses</text>
<text class="body" x="1004" y="428">Resource checks + capacity slot</text>
<path class="edge" d="M250 456V510"/>
<path class="edge" d="M720 456V510"/>
<path class="edge" d="M1190 456V510"/>
<rect x="40" y="514" width="420" height="164" rx="16" fill="#faf8ff" stroke="#d4c7f6" stroke-width="1.6"/>
<text class="heading" x="64" y="552" style="fill:#17243b">INSPECT ORIGINAL AUDIO</text>
<text class="body" x="64" y="588">Select word / vowel regions</text>
<text class="body" x="64" y="618">Original / segment / loop playback</text>
<text class="body" x="64" y="648">Selection stays on the WAV timeline</text>
<rect x="510" y="514" width="420" height="164" rx="16" fill="#f3fcf8" stroke="#b9e2d1" stroke-width="1.6"/>
<text class="heading" x="534" y="552" style="fill:#17243b">EXTRACT F0 EVIDENCE</text>
<text class="body" x="534" y="588">pYIN + voiced flags / probability</text>
<text class="body" x="534" y="618">RMS + original-rate timestamps</text>
<text class="body" x="534" y="648">No phoneme alignment dependency</text>
<rect x="980" y="514" width="420" height="164" rx="16" fill="#fffaf4" stroke="#efcfaa" stroke-width="1.6"/>
<text class="heading" x="1004" y="552" style="fill:#17243b">ALIGN + MAP STRUCTURE</text>
<text class="body" x="1004" y="588">MFA → original TextGrid intervals</text>
<text class="body" x="1004" y="618">Sudachi reading / Mora mapping</text>
<text class="body" x="1004" y="648">Native Phone labels stay explicit</text>
<path class="edge" d="M250 678V730"/>
<path class="edge" d="M720 678V730"/>
<path class="edge" d="M1190 678V730"/>
<rect x="40" y="734" width="420" height="132" rx="16" fill="#faf8ff" stroke="#d4c7f6" stroke-width="1.6"/>
<text class="heading" x="64" y="772" style="fill:#17243b">RECORD AGAIN</text>
<text class="body" x="64" y="808">Listen, adjust and repeat</text>
<text class="body" x="64" y="838">No inferred pronunciation score</text>
<rect x="510" y="734" width="420" height="132" rx="16" fill="#f3fcf8" stroke="#b9e2d1" stroke-width="1.6"/>
<text class="heading" x="534" y="772" style="fill:#17243b">GATE + COMPARE CURVES</text>
<text class="body" x="534" y="808">Keep gaps; insufficient → ABSTAINED</text>
<text class="body" x="534" y="838">Optional same-sentence synth. F0</text>
<rect x="980" y="734" width="420" height="132" rx="16" fill="#fffaf4" stroke="#efcfaa" stroke-width="1.6"/>
<text class="heading" x="1004" y="772" style="fill:#17243b">DESCRIPTIVE EVIDENCE</text>
<text class="body" x="1004" y="808">Duration / reference / variant probe</text>
<text class="body" x="1004" y="838">Explicit limits; no correctness label</text>
<path class="edge" d="M250 866V918"/>
<path class="edge" d="M720 866V918"/>
<path class="edge" d="M1190 866V918"/>
<rect x="40" y="922" width="1360" height="104" rx="16" fill="#eef7ff" stroke="#b4d9f7" stroke-width="1.6"/>
<text class="heading" x="64" y="960" style="fill:#17243b">02  PRESENT RESULTS IN THE CURRENT SESSION</text>
<text class="body" x="64" y="996">Local playback  |  Hz / relative-semitone contours  |  Experimental structure and evidence  |  Explicit failure / abstention</text>
<text class="small" x="44" y="1067">X-Ray controls: real stage polling → server-confirmed cancel → worker-tree termination, workspace cleanup and slot release.</text></svg>
